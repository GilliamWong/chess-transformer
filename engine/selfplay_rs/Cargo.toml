[package]
name = "selfplay_rs"
version = "0.1.0"
edition = "2024"

[lib]
name = "selfplay_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.2", features = ["extension-module"] }
rand = "0.10.3"
rand_chacha = "0.10.0"
rand_distr = "0.6.0"
shakmaty = "0.30.1"
shakmaty-syzygy = { version = "0.28.1", features = ["mmap"] }

[profile.release]
codegen-units = 1
lto = "fat"
