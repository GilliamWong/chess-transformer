[project]
name = "chess-transformer"
version = "0.1.0"
description = "A transformer that plays chess, trained on Stockfish's moves and evals, with MCTS and self-play"
requires-python = ">=3.10"
dependencies = [
    "chess>=1.11",
    "matplotlib>=3.8", # tools/plot_templates.py
    "numpy>=1.26", # torch warns on every start without it
    "tensorboard>=2.15",
    "torch>=2.9",
    "tqdm>=4.66",
    # torch.compile needs triton; on Windows only this community build exists
    "triton-windows>=3.5; sys_platform == 'win32'",
    "zstandard>=0.25.0", # tools/puzzles.py
]

[dependency-groups]
dev = ["pytest>=8"]
# engine/selfplay_rs/, needs Rust (https://rustup.rs). A training-only machine can skip it: uv sync --no-group selfplay
selfplay = ["selfplay-rs"]

# scripts run from the repository root, not an installable package
[tool.uv]
package = false
default-groups = ["dev", "selfplay"]

# PyPI's Windows torch is CPU only, so torch comes from PyTorch's CUDA 13.0 index (RTX 50 needs CUDA 12.8+)
[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
selfplay-rs = { path = "engine/selfplay_rs" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
